version: '3.8'

services:
  backend:
    build: .
    container_name: flashdelivery-backend
    ports:
      - "9000:9000"
    environment:
      SPRING_APPLICATION_NAME: FlashDelivery
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/flashdeliverydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: amine1230
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SERVER_PORT: 9000
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: flashdeliverydb
      MYSQL_ROOT_PASSWORD: amine1230
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: